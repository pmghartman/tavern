[package]
name = "tavern"
version = "0.5.0"
description = "Tavern desktop app: a window onto a Tavern server"
edition = "2021"

[[bin]]
name = "tavern"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
